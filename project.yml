name: oCam
options:
  bundleIdPrefix: com.personal
targets:
  oCam:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: .
        includes:
          - "*.swift"
          - "Assets.xcassets"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: oCam
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: oCam
        CFBundleName: oCam
        UILaunchScreen: {}
        NSCameraUsageDescription: "oCam accede directamente al sensor para captura cinematográfica."
        NSPhotoLibraryAddUsageDescription: "Guardar tus fotos con metadatos EXIF completos en la fototeca."
        NSPhotoLibraryUsageDescription: "Importar y revelar fotos en el laboratorio de oCam."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
