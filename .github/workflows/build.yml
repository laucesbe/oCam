name: Crear IPA para iPhone

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Logo y Generar Proyecto Xcode
        run: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          if [ -f "icon.png" ]; then
            sips -s format jpeg icon.png --out temp_no_alpha.jpg
            sips -s format png -z 1024 1024 temp_no_alpha.jpg --out Assets.xcassets/AppIcon.appiconset/icon.png
          else
            sips -s format jpeg /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/ToolbarAdvanced.icns --out temp_no_alpha.jpg
            sips -s format png -z 1024 1024 temp_no_alpha.jpg --out Assets.xcassets/AppIcon.appiconset/icon.png
          fi
          cat << 'EOF' > Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "icon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          brew install xcodegen
          xcodegen generate

      - name: Compilar App sin firma (para Sideloadly)
        run: |
          xcodebuild -project ChromaCam.xcodeproj \
            -scheme ChromaCam \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar archivo .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ChromaCam.app Payload/
          zip -r ChromaCam.ipa Payload

      - name: Subir archivo IPA listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ChromaCam-IPA
          path: ChromaCam.ipa
