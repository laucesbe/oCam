workflows:
  ios-ipa:
    name: Crear IPA ChromaCam
    instance_type: mac_mini_m2
    scripts:
      - name: Generar y Compilar IPA
        script: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project ChromaCam.xcodeproj \
            -scheme ChromaCam \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ChromaCam.app Payload/
          zip -r ChromaCam.ipa Payload
    artifacts:
      - ChromaCam.ipa
